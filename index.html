<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FF Scheme Test</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{background:#020008;color:#fff;font-family:monospace;padding:20px;min-height:100vh;}
h2{color:#ff1133;font-size:14px;letter-spacing:3px;margin-bottom:20px;text-align:center;}
.btn{display:block;width:100%;padding:14px;margin-bottom:10px;background:rgba(255,17,51,.1);border:1px solid rgba(255,17,51,.3);border-radius:12px;color:#fff;font-family:monospace;font-size:11px;letter-spacing:.5px;cursor:pointer;text-align:left;-webkit-user-select:none;}
.btn:active{background:rgba(255,17,51,.3);}
.scheme{color:#ff3355;font-size:10px;display:block;margin-top:4px;word-break:break-all;}
#log{margin-top:20px;background:rgba(0,0,0,.8);border:1px solid rgba(255,17,51,.2);border-radius:10px;padding:12px;font-size:10px;color:#00ffaa;min-height:60px;}
</style>
</head>
<body>
<h2>FF SCHEME TESTER</h2>
<p style="font-size:10px;color:#6a3545;text-align:center;margin-bottom:16px;">Bấm từng nút — cái nào mở FF thì báo tôi số mấy</p>

<div id="btns"></div>
<div id="log">// log xuất hiện ở đây</div>

<script>
const schemes = [
  'freefire://',
  'freefireth://',
  'com.dts.freefireth://',
  'garena://freefire',
  'garena://game?id=100067',
  'garena://open?gameid=100067',
  'garenaff://',
  'ff://',
  'garenaworld://freefire',
  'garena://startgame?id=100067',
];

const box = document.getElementById('btns');
const log = document.getElementById('log');

schemes.forEach((s, i) => {
  const b = document.createElement('button');
  b.className = 'btn';
  b.innerHTML = `<b>#${i+1}</b><span class="scheme">${s}</span>`;
  b.onclick = () => {
    log.textContent = `[${i+1}] Trying: ${s}`;
    const a = document.createElement('a');
    a.href = s;
    a.style.cssText = 'display:none;position:fixed;top:0;left:0;';
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { try{document.body.removeChild(a);}catch(e){} }, 200);
  };
  box.appendChild(b);
});
</script>
</body>
</html>
