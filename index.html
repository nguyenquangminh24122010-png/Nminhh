<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FF MAX Scheme Test</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{background:#020008;color:#fff;font-family:monospace;padding:20px;min-height:100vh;}
h2{color:#ffcc44;font-size:14px;letter-spacing:3px;margin-bottom:8px;text-align:center;}
p{font-size:10px;color:#6a3545;text-align:center;margin-bottom:16px;}
.btn{display:block;width:100%;padding:14px;margin-bottom:10px;background:rgba(255,200,0,.08);border:1px solid rgba(255,200,0,.25);border-radius:12px;color:#fff;font-family:monospace;font-size:11px;cursor:pointer;text-align:left;-webkit-user-select:none;}
.btn:active{background:rgba(255,200,0,.2);}
.scheme{color:#ffcc44;font-size:10px;display:block;margin-top:4px;word-break:break-all;}
</style>
</head>
<body>
<h2>FF MAX SCHEME TEST</h2>
<p>Bấm từng nút — cái nào mở FF MAX thì báo số mấy</p>
<div id="btns"></div>
<script>
const schemes = [
  'freefiremax://',
  'com.dts.freefiremax://',
  'ffmax://',
  'garena://freefiremax',
  'garenamax://',
  'freefireMAX://',
  'garena://game?id=100734',
  'garena://open?gameid=100734',
  'garenafreefiremax://',
  'freefire-max://',
];
const box = document.getElementById('btns');
schemes.forEach((s,i) => {
  const b = document.createElement('button');
  b.className = 'btn';
  b.innerHTML = `<b>#${i+1}</b><span class="scheme">${s}</span>`;
  b.onclick = () => {
    const a = document.createElement('a');
    a.href = s;
    a.style.cssText = 'display:none;position:fixed;top:0;left:0;';
    document.body.appendChild(a);
    a.click();
    setTimeout(()=>{try{document.body.removeChild(a);}catch(e){}},200);
  };
  box.appendChild(b);
});
</script>
</body>
</html>
